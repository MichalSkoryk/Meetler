spring:
  application:
    name: Meetler

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meetler}
    username: ${SPRING_DATASOURCE_USERNAME:meetler}
    password: ${SPRING_DATASOURCE_PASSWORD:TestP@ssword2!}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

web:
  cors:
    mappings:
      - path: /**
        allowed-origins: "*"
        allowed-methods: "*"
        allowed-headers: "*"
        allow-credentials: false

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

logging:
  level:
    root: INFO
    com.skoryk.projects.meetler: INFO
    org.flywaydb: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fde0a94e1b5da4f94b5d08c7e77b1eae2f3b9a5e8d7c6b5a4f3e2d1c0b9a8d7c6e5f4d3c2b1a0f9e8d7c6b5a4f3e2d1}

guest-login:
  token-ttl-minutes: ${GUEST_LOGIN_TOKEN_TTL_MINUTES:30}
  login-url: ${GUEST_LOGIN_URL:http://localhost:8080/api/auth/guest/login}

email:
  from: ${EMAIL_FROM:Meetler <no-reply@localhost>}
  resend:
    api-key: ${RESEND_API_KEY:}
    api-url: ${RESEND_API_URL:https://api.resend.com}

auth:
  refresh-token:
    ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    reset-url: ${PASSWORD_RESET_URL:http://localhost:8080/api/auth/password/reset/confirm}
    frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:8081}
  google:
    oauth:
      client-id: ${GOOGLE_AUTH_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
      client-secret: ${GOOGLE_AUTH_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
      redirect-uri: ${GOOGLE_AUTH_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
  microsoft:
    oauth:
      client-id: ${MICROSOFT_AUTH_CLIENT_ID:}
      client-secret: ${MICROSOFT_AUTH_CLIENT_SECRET:}
      redirect-uri: ${MICROSOFT_AUTH_REDIRECT_URI:http://localhost:8080/api/auth/microsoft/callback}

external-calendar:
  token-encryption-key: ${EXTERNAL_CALENDAR_TOKEN_ENCRYPTION_KEY:QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=}
  google:
    oauth:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/external-calendars/google/callback}
