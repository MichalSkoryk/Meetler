<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meetler Test Console</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .app {
        width: min(1440px, calc(100% - 28px));
        margin: 0 auto;
        padding: 24px 0;
      }

      header {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 18px;
        letter-spacing: 0;
      }

      h3 {
        margin: 0 0 10px;
        font-size: 15px;
        letter-spacing: 0;
      }

      .muted {
        color: #637084;
        font-size: 13px;
      }

      .status {
        min-width: 220px;
        border: 1px solid #ccd5e2;
        border-radius: 8px;
        background: #ffffff;
        padding: 12px;
        font-size: 13px;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }

      .tabs button,
      .button,
      button {
        min-height: 36px;
        border: 1px solid #243044;
        border-radius: 6px;
        background: #243044;
        color: #ffffff;
        padding: 0 12px;
        font-weight: 650;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .tabs button {
        background: #ffffff;
        color: #243044;
      }

      .tabs button.active {
        background: #243044;
        color: #ffffff;
      }

      button.secondary,
      .button.secondary {
        background: #ffffff;
        color: #243044;
      }

      button.danger {
        border-color: #b42318;
        background: #b42318;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 14px;
      }

      .wide {
        grid-column: 1 / -1;
      }

      section,
      .panel {
        border: 1px solid #d5dce7;
        border-radius: 8px;
        background: #ffffff;
        padding: 16px;
      }

      label {
        display: block;
        margin: 10px 0 5px;
        color: #334155;
        font-size: 12px;
        font-weight: 700;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 36px;
        border: 1px solid #c8d1df;
        border-radius: 6px;
        background: #ffffff;
        padding: 7px 9px;
        color: #172033;
      }

      textarea {
        min-height: 82px;
        resize: vertical;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .row3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      pre {
        overflow: auto;
        min-height: 220px;
        max-height: 520px;
        margin: 0;
        border-radius: 8px;
        background: #101827;
        color: #d5deea;
        padding: 14px;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        border-bottom: 1px solid #e2e8f0;
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: #475569;
        font-size: 12px;
        font-weight: 750;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: #edf2f7;
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 700;
      }

      .pill.ok {
        background: #dcfce7;
        color: #166534;
      }

      .pill.warn {
        background: #fef3c7;
        color: #92400e;
      }

      @media (max-width: 760px) {
        header,
        .row,
        .row3 {
          grid-template-columns: 1fr;
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      const API = "/api";
      const initialRange = () => {
        const from = new Date();
        from.setMinutes(0, 0, 0);
        const to = new Date(from.getTime() + 7 * 24 * 60 * 60 * 1000);
        return { from: toLocalInput(from), to: toLocalInput(to) };
      };

      function toLocalInput(date) {
        const pad = (n) => String(n).padStart(2, "0");
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(
          date.getHours(),
        )}:${pad(date.getMinutes())}`;
      }

      function toOffset(value) {
        if (!value) return "";
        return new Date(value).toISOString();
      }

      function toDateOnly(value) {
        return value ? value.slice(0, 10) : "";
      }

      function setCookie(name, value) {
        document.cookie = `${name}=${encodeURIComponent(value || "")}; Path=/; SameSite=Lax`;
      }

      function deleteCookie(name) {
        document.cookie = `${name}=; Path=/; Max-Age=0; SameSite=Lax`;
      }

      function pretty(value) {
        return typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      function Field({ label, value, onChange, type = "text", placeholder, children }) {
        return (
          <label>
            {label}
            {children || (
              <input
                type={type}
                value={value ?? ""}
                placeholder={placeholder || ""}
                onChange={(e) => onChange(e.target.value)}
              />
            )}
          </label>
        );
      }

      function SelectField({ label, value, onChange, options }) {
        return (
          <label>
            {label}
            <select value={value ?? ""} onChange={(e) => onChange(e.target.value)}>
              {options.map((option) => (
                <option key={option.value} value={option.value}>
                  {option.label}
                </option>
              ))}
            </select>
          </label>
        );
      }

      function App() {
        const [tab, setTab] = useState("auth");
        const [output, setOutput] = useState("");
        const [busy, setBusy] = useState(false);
        const [accessToken, setAccessToken] = useState("");
        const [refreshToken, setRefreshToken] = useState("");
        const [calendars, setCalendars] = useState([]);
        const [templates, setTemplates] = useState([]);
        const [groups, setGroups] = useState([]);
        const [groupMembers, setGroupMembers] = useState([]);
        const [groupsOutput, setGroupsOutput] = useState(null);
        const [gridRows, setGridRows] = useState([]);
        const [groupEvents, setGroupEvents] = useState([]);

        const [auth, setAuth] = useState({ email: "", name: "", password: "" });
        const [calendarForm, setCalendarForm] = useState({
          name: "Internal calendar",
          provider: "INTERNAL",
          color: "#4f46e5",
          externalId: "",
          syncDirection: "NONE",
        });
        const [templateForm, setTemplateForm] = useState({
          name: "Default availability",
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Warsaw",
          isDefault: true,
          defaultAvailabilityStatus: "BUSY",
        });
        const [templateId, setTemplateId] = useState("");
        const [blockForm, setBlockForm] = useState({
          startsAt: initialRange().from,
          endsAt: toLocalInput(new Date(new Date().setHours(new Date().getHours() + 1))),
          status: "AVAILABLE",
          note: "",
        });
        const [recurringForm, setRecurringForm] = useState({
          frequency: "WEEKLY",
          intervalCount: 1,
          occurrenceCount: "",
          dayOfWeek: "MONDAY",
          dayOfMonth: 1,
          monthOfYear: 1,
          startTime: "09:00:00",
          endTime: "17:00:00",
          status: "AVAILABLE",
          startsOn: "",
          endsOn: "",
          note: "",
        });
        const [sourceCalendarId, setSourceCalendarId] = useState("");
        const [groupForm, setGroupForm] = useState({
          groupName: "Weekend plans",
          groupId: "",
          inviteCode: "",
          eventRequiresConfirmation: true,
        });
        const [eventForm, setEventForm] = useState({
          title: "Group meetup",
          description: "",
          startsAt: initialRange().from,
          endsAt: toLocalInput(new Date(new Date().setHours(new Date().getHours() + 1))),
          eventId: "",
          responseStatus: "ACCEPTED",
        });
        const [adminUserId, setAdminUserId] = useState("");
        const [range, setRange] = useState(initialRange());

        const hasToken = Boolean(accessToken);

        useEffect(() => {
          const savedAccess = localStorage.getItem("meetler.accessToken") || "";
          const savedRefresh = localStorage.getItem("meetler.refreshToken") || "";
          setAccessToken(savedAccess);
          setRefreshToken(savedRefresh);
          setCookie("meetler_access_token", savedAccess);
        }, []);

        function resetWorkspaceState() {
          setCalendars([]);
          setTemplates([]);
          setGroups([]);
          setGroupMembers([]);
          setTemplateId("");
          setSourceCalendarId("");
          setAdminUserId("");
          setGroupsOutput(null);
          setGridRows([]);
          setGroupEvents([]);
        }

        function saveTokens(tokens) {
          const nextAccess = tokens.accessToken || "";
          const nextRefresh = tokens.refreshToken || "";
          localStorage.setItem("meetler.accessToken", nextAccess);
          localStorage.setItem("meetler.refreshToken", nextRefresh);
          setCookie("meetler_access_token", nextAccess);
          resetWorkspaceState();
          setAccessToken(nextAccess);
          setRefreshToken(nextRefresh);
        }

        function clearTokens() {
          localStorage.removeItem("meetler.accessToken");
          localStorage.removeItem("meetler.refreshToken");
          deleteCookie("meetler_access_token");
          resetWorkspaceState();
          setAccessToken("");
          setRefreshToken("");
        }

        async function api(path, options = {}) {
          setBusy(true);
          try {
            const token = localStorage.getItem("meetler.accessToken") || accessToken;
            const response = await fetch(`${API}${path}`, {
              ...options,
              headers: {
                ...(options.body ? { "Content-Type": "application/json" } : {}),
                ...(token ? { Authorization: `Bearer ${token}` } : {}),
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            const body = text ? JSON.parse(text) : null;
            if (!response.ok) {
              throw body || {
                status: response.status,
                message:
                  response.status === 403
                    ? "Forbidden. Log in again and refresh templates before calling this endpoint."
                    : response.statusText,
              };
            }
            setOutput(pretty(body ?? "OK"));
            return body;
          } catch (error) {
            setOutput(pretty(error));
            throw error;
          } finally {
            setBusy(false);
          }
        }

        async function refreshCalendars() {
          const data = await api("/calendars");
          setCalendars(data || []);
          return data || [];
        }

        async function refreshTemplates() {
          const data = await api("/availability/templates?page=0");
          const items = data?.content || data || [];
          setTemplates(items);
          if (!items.some((template) => template.id === templateId)) {
            setTemplateId(items[0]?.id || "");
          }
          return items;
        }

        async function refreshGroups(preferredGroupId = groupForm.groupId) {
          const data = await api("/groups");
          const items = data || [];
          setGroups(items);
          if (!items.some((group) => group.id === preferredGroupId)) {
            setGroupForm((current) => ({
              ...current,
              groupId: items[0]?.id || "",
              eventRequiresConfirmation: items[0]?.eventRequiresConfirmation ?? current.eventRequiresConfirmation,
            }));
          } else {
            const selected = items.find((group) => group.id === preferredGroupId);
            setGroupForm((current) => ({
              ...current,
              groupId: preferredGroupId,
              eventRequiresConfirmation: selected?.eventRequiresConfirmation ?? current.eventRequiresConfirmation,
            }));
          }
          return items;
        }

        async function refreshGroupMembers(groupId = groupForm.groupId) {
          const data = await api(`/groups/${groupId}/members`);
          const items = data || [];
          setGroupMembers(items);
          if (!items.some((member) => member.userId === adminUserId || member.user?.id === adminUserId)) {
            setAdminUserId(items[0]?.userId || items[0]?.user?.id || "");
          }
          return items;
        }

        async function refreshGroupEvents(groupId = groupForm.groupId) {
          const data = await api(`/groups/${groupId}/events?from=${encodeURIComponent(toOffset(range.from))}&to=${encodeURIComponent(toOffset(range.to))}`);
          const items = data || [];
          setGroupEvents(items);
          if (!items.some((event) => event.id === eventForm.eventId)) {
            setEventForm((current) => ({ ...current, eventId: items[0]?.id || "" }));
          }
          return items;
        }

        function availabilityBlockRangeQuery() {
          const params = new URLSearchParams({ page: "0" });
          if (range.from) params.set("from", toOffset(range.from));
          if (range.to) params.set("to", toOffset(range.to));
          return params.toString();
        }

        function recurringBlockRangeQuery() {
          const params = new URLSearchParams({ page: "0" });
          if (range.from) params.set("from", toDateOnly(range.from));
          if (range.to) params.set("to", toDateOnly(range.to));
          return params.toString();
        }

        const templateOptions = [{ value: "", label: "Select template" }].concat(
          templates.map((template) => ({
            value: template.id,
            label: `${template.name} (${template.timezone}, empty=${template.defaultAvailabilityStatus || "BUSY"})`,
          })),
        );

        const calendarOptions = [{ value: "", label: "Select calendar" }].concat(
          calendars.map((calendar) => ({
            value: calendar.id,
            label: `${calendar.name} [${calendar.provider}]`,
          })),
        );

        const groupOptions = [{ value: "", label: "Select group" }].concat(
          groups.map((group) => ({
            value: group.id,
            label: `${group.name}${group.role ? ` [${group.role}]` : ""}${group.eventRequiresConfirmation === false ? " no-confirm" : " confirm"}`,
          })),
        );

        const memberOptions = [{ value: "", label: "Select user" }].concat(
          groupMembers.map((member) => ({
            value: member.userId || member.user?.id || "",
            label: `${member.userName || member.userEmail || member.user?.name || member.user?.email || member.userId || member.user?.id || "User"} [${member.role}]`,
          })),
        );

        const eventOptions = [{ value: "", label: "Select event" }].concat(
          groupEvents.map((event) => ({
            value: event.id,
            label: `${event.title} [${event.status}]`,
          })),
        );

        function AuthTab() {
          return (
            <div className="grid">
              <section>
                <h2>Password Auth</h2>
                <Field label="Email" value={auth.email} onChange={(email) => setAuth({ ...auth, email })} />
                <Field label="Name" value={auth.name} onChange={(name) => setAuth({ ...auth, name })} />
                <Field
                  label="Password"
                  type="password"
                  value={auth.password}
                  onChange={(password) => setAuth({ ...auth, password })}
                />
                <div className="actions">
                  <button
                    disabled={busy}
                    onClick={async () => saveTokens(await api("/auth/register", {
                      method: "POST",
                      body: JSON.stringify(auth),
                    }))}
                  >
                    Register
                  </button>
                  <button
                    disabled={busy}
                    onClick={async () => saveTokens(await api("/auth/login", {
                      method: "POST",
                      body: JSON.stringify({ email: auth.email, password: auth.password }),
                    }))}
                  >
                    Login
                  </button>
                  <button
                    className="danger"
                    disabled={busy}
                    onClick={async () => {
                      if (refreshToken) {
                        await api("/auth/logout", {
                          method: "POST",
                          body: JSON.stringify({ refreshToken }),
                        });
                      }
                      clearTokens();
                      setOutput("Logged out.");
                    }}
                  >
                    Logout
                  </button>
                </div>
              </section>

              <section>
                <h2>OAuth Login</h2>
                <div className="actions">
                  <a className="button secondary" href="/api/auth/google/login">Google Login</a>
                  <a className="button secondary" href="/api/auth/microsoft/login">Microsoft Login</a>
                </div>
                <p className="muted">OAuth login may return JSON directly from the backend. Paste the tokens below if needed.</p>
              </section>

              <section className="wide">
                <h2>Tokens</h2>
                <Field label="Access token" value={accessToken} onChange={setAccessToken} />
                <Field label="Refresh token" value={refreshToken} onChange={setRefreshToken} />
                <div className="actions">
                  <button onClick={() => { saveTokens({ accessToken, refreshToken }); setOutput("Tokens saved."); }}>
                    Save Tokens
                  </button>
                  <button className="secondary" onClick={() => { clearTokens(); setOutput("Tokens cleared."); }}>
                    Clear Tokens
                  </button>
                </div>
              </section>
            </div>
          );
        }

        function CalendarsTab() {
          return (
            <div className="grid">
              <section>
                <h2>External Calendar OAuth</h2>
                <div className="row">
                  <Field label="Import from" type="datetime-local" value={range.from} onChange={(from) => setRange({ ...range, from })} />
                  <Field label="Import to" type="datetime-local" value={range.to} onChange={(to) => setRange({ ...range, to })} />
                </div>
                <div className="actions">
                  <button
                    onClick={() => {
                      if (!accessToken) return setOutput("Login first, or paste and save an access token.");
                      setCookie("meetler_access_token", accessToken);
                      const returnUrl = encodeURIComponent(window.location.href);
                      window.location.href = `/api/external-calendars/google/connect?returnUrl=${returnUrl}`;
                    }}
                  >
                    Connect Google Calendar
                  </button>
                  <button
                    disabled={busy}
                    onClick={() => api(`/external-calendars/google/import?from=${encodeURIComponent(toOffset(range.from))}&to=${encodeURIComponent(toOffset(range.to))}`, { method: "POST" })}
                  >
                    Import Google Events
                  </button>
                </div>
              </section>

              <section>
                <h2>Create Calendar</h2>
                <Field label="Name" value={calendarForm.name} onChange={(name) => setCalendarForm({ ...calendarForm, name })} />
                <SelectField
                  label="Provider"
                  value={calendarForm.provider}
                  onChange={(provider) => setCalendarForm({ ...calendarForm, provider })}
                  options={[
                    { value: "INTERNAL", label: "INTERNAL" },
                    { value: "GOOGLE", label: "GOOGLE" },
                    { value: "TEAMS", label: "TEAMS" },
                  ]}
                />
                <div className="row">
                  <Field label="Color" value={calendarForm.color} onChange={(color) => setCalendarForm({ ...calendarForm, color })} />
                  <SelectField
                    label="Sync direction"
                    value={calendarForm.syncDirection}
                    onChange={(syncDirection) => setCalendarForm({ ...calendarForm, syncDirection })}
                    options={["NONE", "TO_PROVIDER", "FROM_PROVIDER", "BIDIRECTIONAL"].map((value) => ({ value, label: value }))}
                  />
                </div>
                <Field label="External ID" value={calendarForm.externalId} onChange={(externalId) => setCalendarForm({ ...calendarForm, externalId })} />
                <div className="actions">
                  <button disabled={busy} onClick={() => api("/calendars", { method: "POST", body: JSON.stringify(calendarForm) }).then(refreshCalendars)}>
                    Create Calendar
                  </button>
                  <button className="secondary" disabled={busy} onClick={refreshCalendars}>List Calendars</button>
                </div>
              </section>

              <section className="wide">
                <h2>Calendars</h2>
                <DataTable rows={calendars} columns={["id", "name", "provider", "externalId", "syncDirection"]} />
              </section>
            </div>
          );
        }

        function AvailabilityTab() {
          return (
            <div className="grid">
              <section>
                <h2>Templates</h2>
                <Field label="Name" value={templateForm.name} onChange={(name) => setTemplateForm({ ...templateForm, name })} />
                <Field label="Timezone" value={templateForm.timezone} onChange={(timezone) => setTemplateForm({ ...templateForm, timezone })} />
                <SelectField
                  label="Default"
                  value={String(templateForm.isDefault)}
                  onChange={(value) => setTemplateForm({ ...templateForm, isDefault: value === "true" })}
                  options={[{ value: "true", label: "true" }, { value: "false", label: "false" }]}
                />
                <SelectField
                  label="Empty space"
                  value={templateForm.defaultAvailabilityStatus}
                  onChange={(defaultAvailabilityStatus) => setTemplateForm({ ...templateForm, defaultAvailabilityStatus })}
                  options={[
                    { value: "BUSY", label: "BUSY" },
                    { value: "AVAILABLE", label: "AVAILABLE" },
                  ]}
                />
                <div className="actions">
                  <button disabled={busy} onClick={() => api("/availability/templates", { method: "POST", body: JSON.stringify(templateForm) }).then(refreshTemplates)}>
                    Create Template
                  </button>
                  <button className="secondary" disabled={busy} onClick={refreshTemplates}>List Templates</button>
                </div>
              </section>

              <section>
                <h2>Active Template</h2>
                <SelectField label="Template" value={templateId} onChange={setTemplateId} options={templateOptions} />
                <div className="row">
                  <Field label="Range from" type="datetime-local" value={range.from} onChange={(from) => setRange({ ...range, from })} />
                  <Field label="Range to" type="datetime-local" value={range.to} onChange={(to) => setRange({ ...range, to })} />
                </div>
                <div className="actions">
                  <button className="secondary" disabled={!templateId || busy} onClick={() => api(`/availability/templates/${templateId}`)}>Get</button>
                  <button className="secondary" disabled={!templateId || busy} onClick={() => api(`/availability/templates/${templateId}/blocks?${availabilityBlockRangeQuery()}`)}>List Blocks</button>
                  <button className="secondary" disabled={!templateId || busy} onClick={() => api(`/availability/templates/${templateId}/recurring-blocks?${recurringBlockRangeQuery()}`)}>List Recurring</button>
                  <button className="secondary" disabled={!templateId || busy} onClick={() => api(`/availability/templates/${templateId}/blocks?page=0`)}>List All Blocks</button>
                </div>
              </section>

              <section>
                <h2>One-Off Block</h2>
                <div className="row">
                  <Field label="Starts at" type="datetime-local" value={blockForm.startsAt} onChange={(startsAt) => setBlockForm({ ...blockForm, startsAt })} />
                  <Field label="Ends at" type="datetime-local" value={blockForm.endsAt} onChange={(endsAt) => setBlockForm({ ...blockForm, endsAt })} />
                </div>
                <SelectField label="Status" value={blockForm.status} onChange={(status) => setBlockForm({ ...blockForm, status })} options={["AVAILABLE", "BUSY"].map((value) => ({ value, label: value }))} />
                <Field label="Note" value={blockForm.note} onChange={(note) => setBlockForm({ ...blockForm, note })} />
                <button disabled={!templateId || busy} onClick={() => api(`/availability/templates/${templateId}/blocks`, {
                  method: "POST",
                  body: JSON.stringify({
                    startsAt: toOffset(blockForm.startsAt),
                    endsAt: toOffset(blockForm.endsAt),
                    status: blockForm.status,
                    note: blockForm.note || null,
                  }),
                })}>
                  Add Block
                </button>
              </section>

              <section>
                <h2>Recurring Block</h2>
                <div className="row">
                  <SelectField label="Frequency" value={recurringForm.frequency} onChange={(frequency) => setRecurringForm({ ...recurringForm, frequency })} options={["DAILY", "WEEKLY", "MONTHLY", "YEARLY"].map((value) => ({ value, label: value }))} />
                  <SelectField label="Status" value={recurringForm.status} onChange={(status) => setRecurringForm({ ...recurringForm, status })} options={["AVAILABLE", "BUSY"].map((value) => ({ value, label: value }))} />
                </div>
                <div className="row3">
                  <Field label="Interval" type="number" value={recurringForm.intervalCount} onChange={(intervalCount) => setRecurringForm({ ...recurringForm, intervalCount })} />
                  <Field label="Occurrences" type="number" value={recurringForm.occurrenceCount} onChange={(occurrenceCount) => setRecurringForm({ ...recurringForm, occurrenceCount })} />
                  <SelectField label="Day of week" value={recurringForm.dayOfWeek} onChange={(dayOfWeek) => setRecurringForm({ ...recurringForm, dayOfWeek })} options={["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"].map((value) => ({ value, label: value }))} />
                </div>
                <div className="row">
                  <Field label="Day of month" type="number" value={recurringForm.dayOfMonth} onChange={(dayOfMonth) => setRecurringForm({ ...recurringForm, dayOfMonth })} />
                  <Field label="Month of year" type="number" value={recurringForm.monthOfYear} onChange={(monthOfYear) => setRecurringForm({ ...recurringForm, monthOfYear })} />
                </div>
                <div className="row">
                  <Field label="Start time" value={recurringForm.startTime} onChange={(startTime) => setRecurringForm({ ...recurringForm, startTime })} />
                  <Field label="End time" value={recurringForm.endTime} onChange={(endTime) => setRecurringForm({ ...recurringForm, endTime })} />
                </div>
                <div className="row">
                  <Field label="Starts on" type="date" value={recurringForm.startsOn} onChange={(startsOn) => setRecurringForm({ ...recurringForm, startsOn })} />
                  <Field label="Ends on" type="date" value={recurringForm.endsOn} onChange={(endsOn) => setRecurringForm({ ...recurringForm, endsOn })} />
                </div>
                <button disabled={!templateId || busy} onClick={() => api(`/availability/templates/${templateId}/recurring-blocks`, {
                  method: "POST",
                  body: JSON.stringify(cleanRecurring(recurringForm)),
                })}>
                  Add Recurring
                </button>
              </section>

              <section>
                <h2>Source Calendars</h2>
                <SelectField label="Calendar" value={sourceCalendarId} onChange={setSourceCalendarId} options={calendarOptions} />
                <div className="actions">
                  <button disabled={!templateId || !sourceCalendarId || busy} onClick={() => api(`/availability/templates/${templateId}/source-calendars`, {
                    method: "POST",
                    body: JSON.stringify({ calendarId: sourceCalendarId, includeBusyEvents: true }),
                  })}>
                    Attach Source
                  </button>
                  <button className="secondary" disabled={!templateId || busy} onClick={() => api(`/availability/templates/${templateId}/source-calendars`)}>
                    List Sources
                  </button>
                </div>
              </section>

              <section>
                <h2>Resolve Template</h2>
                <div className="row">
                  <Field label="From" type="datetime-local" value={range.from} onChange={(from) => setRange({ ...range, from })} />
                  <Field label="To" type="datetime-local" value={range.to} onChange={(to) => setRange({ ...range, to })} />
                </div>
                <button disabled={!templateId || busy} onClick={() => api(`/availability/templates/${templateId}/resolved?from=${encodeURIComponent(toOffset(range.from))}&to=${encodeURIComponent(toOffset(range.to))}`)}>
                  Resolve
                </button>
              </section>
            </div>
          );
        }

        function GroupsTab() {
          const memberRows = groupMembers.map((member) => ({
            id: member.id,
            userId: member.userId || member.user?.id,
            name: member.userName || member.user?.name,
            email: member.userEmail || member.user?.email,
            role: member.role,
            joinedAt: member.joinedAt,
            availabilityTemplateName: member.availabilityTemplateName,
          }));

          return (
            <div className="grid">
              <section>
                <h2>Groups</h2>
                <Field label="Group name" value={groupForm.groupName} onChange={(groupName) => setGroupForm({ ...groupForm, groupName })} />
                <SelectField label="Active group" value={groupForm.groupId} onChange={(groupId) => {
                  const selected = groups.find((group) => group.id === groupId);
                  setGroupForm({
                    ...groupForm,
                    groupId,
                    eventRequiresConfirmation: selected?.eventRequiresConfirmation ?? groupForm.eventRequiresConfirmation,
                  });
                  setGroupEvents([]);
                }} options={groupOptions} />
                <SelectField
                  label="Event confirmation"
                  value={String(groupForm.eventRequiresConfirmation)}
                  onChange={(value) => setGroupForm({ ...groupForm, eventRequiresConfirmation: value === "true" })}
                  options={[
                    { value: "true", label: "Require member confirmation" },
                    { value: "false", label: "Create confirmed immediately" },
                  ]}
                />
                <div className="actions">
                  <button disabled={busy} onClick={async () => {
                    const data = await api("/groups", {
                      method: "POST",
                      body: JSON.stringify({
                        name: groupForm.groupName,
                        eventRequiresConfirmation: groupForm.eventRequiresConfirmation,
                      }),
                    });
                    setGroupForm((current) => ({ ...current, groupId: data.id }));
                    await refreshGroups(data.id);
                  }}>
                    Create Group
                  </button>
                  <button disabled={!groupForm.groupId || busy} onClick={() => api(`/groups/${groupForm.groupId}`, {
                    method: "PATCH",
                    body: JSON.stringify({
                      name: groupForm.groupName,
                      eventRequiresConfirmation: groupForm.eventRequiresConfirmation,
                    }),
                  }).then(() => refreshGroups(groupForm.groupId))}>
                    Update Settings
                  </button>
                  <button className="secondary" disabled={busy} onClick={refreshGroups}>
                    List My Groups
                  </button>
                  <button className="secondary" disabled={!groupForm.groupId || busy} onClick={() => refreshGroupMembers()}>
                    List Members
                  </button>
                </div>
              </section>

              <section>
                <h2>Group Admin</h2>
                <SelectField label="Member" value={adminUserId} onChange={setAdminUserId} options={memberOptions} />
                <Field label="User ID" value={adminUserId} onChange={setAdminUserId} />
                <div className="actions">
                  <button disabled={!groupForm.groupId || !adminUserId || busy} onClick={() => api(`/groups/${groupForm.groupId}/admin/promote/${adminUserId}`, { method: "POST" }).then(() => refreshGroupMembers())}>
                    Promote
                  </button>
                  <button className="secondary" disabled={!groupForm.groupId || !adminUserId || busy} onClick={() => api(`/groups/${groupForm.groupId}/admin/demote/${adminUserId}`, { method: "POST" }).then(() => refreshGroupMembers())}>
                    Demote
                  </button>
                  <button className="secondary" disabled={!groupForm.groupId || !adminUserId || busy} onClick={() => api(`/groups/${groupForm.groupId}/admin/transfer/${adminUserId}`, { method: "POST" }).then(async () => { await refreshGroups(); await refreshGroupMembers(); })}>
                    Transfer Owner
                  </button>
                  <button className="danger" disabled={!groupForm.groupId || !adminUserId || busy} onClick={() => api(`/groups/${groupForm.groupId}/admin/remove/${adminUserId}`, { method: "DELETE" }).then(() => refreshGroupMembers())}>
                    Remove
                  </button>
                </div>
              </section>

              <section>
                <h2>Invites</h2>
                <Field label="Invite code" value={groupForm.inviteCode} onChange={(inviteCode) => setGroupForm({ ...groupForm, inviteCode })} />
                <div className="actions">
                  <button disabled={!groupForm.groupId || busy} onClick={async () => {
                    const data = await api(`/invites/${groupForm.groupId}`, {
                      method: "POST",
                      body: JSON.stringify({ maxUses: 10 }),
                    });
                    setGroupForm({ ...groupForm, inviteCode: data.code });
                  }}>
                    Create Invite
                  </button>
                  <button className="secondary" disabled={!groupForm.inviteCode || busy} onClick={() => api(`/invites/join/${groupForm.inviteCode}`, { method: "POST" })}>
                    Join by Code
                  </button>
                </div>
              </section>

              <section>
                <h2>Group Availability Template</h2>
                <SelectField label="Template" value={templateId} onChange={setTemplateId} options={templateOptions} />
                <div className="actions">
                  <button disabled={!groupForm.groupId || !templateId || busy} onClick={() => api(`/groups/${groupForm.groupId}/members/me/availability-template`, {
                    method: "POST",
                    body: JSON.stringify({ availabilityTemplateId: templateId }),
                  })}>
                    Use Template
                  </button>
                  <button className="secondary" disabled={!groupForm.groupId || busy} onClick={() => api(`/groups/${groupForm.groupId}/members/me/availability-template`)}>
                    Get Selection
                  </button>
                  <button className="secondary" disabled={!groupForm.groupId || busy} onClick={() => api(`/groups/${groupForm.groupId}/members/me/availability-template`, { method: "DELETE" })}>
                    Clear
                  </button>
                </div>
              </section>

              <section>
                <h2>15-Minute Grid</h2>
                <div className="row">
                  <Field label="From" type="datetime-local" value={range.from} onChange={(from) => setRange({ ...range, from })} />
                  <Field label="To" type="datetime-local" value={range.to} onChange={(to) => setRange({ ...range, to })} />
                </div>
                <button disabled={!groupForm.groupId || busy} onClick={async () => {
                  const data = await api(`/groups/${groupForm.groupId}/availability-grid?from=${encodeURIComponent(toOffset(range.from))}&to=${encodeURIComponent(toOffset(range.to))}`);
                  setGridRows(data || []);
                }}>
                  Build Grid
                </button>
              </section>

              <section>
                <h2>Group Events</h2>
                <Field label="Title" value={eventForm.title} onChange={(title) => setEventForm({ ...eventForm, title })} />
                <Field label="Description" value={eventForm.description} onChange={(description) => setEventForm({ ...eventForm, description })} />
                <div className="row">
                  <Field label="Starts at" type="datetime-local" value={eventForm.startsAt} onChange={(startsAt) => setEventForm({ ...eventForm, startsAt })} />
                  <Field label="Ends at" type="datetime-local" value={eventForm.endsAt} onChange={(endsAt) => setEventForm({ ...eventForm, endsAt })} />
                </div>
                <div className="actions">
                  <button disabled={!groupForm.groupId || busy} onClick={() => api(`/groups/${groupForm.groupId}/events`, {
                    method: "POST",
                    body: JSON.stringify({
                      title: eventForm.title,
                      description: eventForm.description || null,
                      startsAt: toOffset(eventForm.startsAt),
                      endsAt: toOffset(eventForm.endsAt),
                    }),
                  }).then(async (event) => {
                    setEventForm((current) => ({ ...current, eventId: event.id }));
                    await refreshGroupEvents();
                  })}>
                    Create Event
                  </button>
                  <button className="secondary" disabled={!groupForm.groupId || busy} onClick={() => refreshGroupEvents()}>
                    List Events
                  </button>
                </div>
              </section>

              <section>
                <h2>Event Response</h2>
                <SelectField label="Event" value={eventForm.eventId} onChange={(eventId) => setEventForm({ ...eventForm, eventId })} options={eventOptions} />
                <SelectField
                  label="Response"
                  value={eventForm.responseStatus}
                  onChange={(responseStatus) => setEventForm({ ...eventForm, responseStatus })}
                  options={[
                    { value: "ACCEPTED", label: "Accept" },
                    { value: "DECLINED", label: "Decline" },
                  ]}
                />
                <div className="actions">
                  <button disabled={!groupForm.groupId || !eventForm.eventId || busy} onClick={() => api(`/groups/${groupForm.groupId}/events/${eventForm.eventId}/response`, {
                    method: "PATCH",
                    body: JSON.stringify({ status: eventForm.responseStatus }),
                  }).then(() => refreshGroupEvents())}>
                    Send Response
                  </button>
                </div>
              </section>

              <section className="wide">
                <h2>My Groups</h2>
                <DataTable rows={groups} columns={["id", "name", "role", "eventRequiresConfirmation", "createdAt", "updatedAt"]} />
              </section>

              <section className="wide">
                <h2>Members</h2>
                <DataTable rows={memberRows} columns={["userId", "name", "email", "role", "availabilityTemplateName", "joinedAt"]} />
              </section>

              <section className="wide">
                <h2>Grid Results</h2>
                <DataTable rows={gridRows.slice(0, 100)} columns={["startsAt", "endsAt", "availableCount", "busyCount", "noTemplateCount"]} />
              </section>

              <section className="wide">
                <h2>Events</h2>
                <DataTable rows={groupEvents.map(flattenEvent)} columns={["id", "title", "status", "requiresConfirmation", "startsAt", "endsAt", "participants"]} />
              </section>
            </div>
          );
        }

        function flattenEvent(event) {
          return {
            ...event,
            participants: (event.participants || [])
              .map((participant) => `${participant.userEmail || participant.userId}:${participant.status}`)
              .join(", "),
          };
        }

        function cleanRecurring(form) {
          const payload = {
            frequency: form.frequency,
            intervalCount: Number(form.intervalCount || 1),
            occurrenceCount: form.occurrenceCount ? Number(form.occurrenceCount) : null,
            startTime: form.startTime,
            endTime: form.endTime,
            status: form.status,
            note: form.note || null,
            startsOn: form.startsOn || null,
            endsOn: form.endsOn || null,
          };
          if (form.frequency === "WEEKLY") payload.dayOfWeek = form.dayOfWeek;
          if (form.frequency === "MONTHLY") payload.dayOfMonth = Number(form.dayOfMonth);
          if (form.frequency === "YEARLY") {
            payload.dayOfMonth = Number(form.dayOfMonth);
            payload.monthOfYear = Number(form.monthOfYear);
          }
          return payload;
        }

        function DataTable({ rows, columns }) {
          if (!rows?.length) return <p className="muted">No rows loaded.</p>;
          return (
            <table>
              <thead>
                <tr>{columns.map((column) => <th key={column}>{column}</th>)}</tr>
              </thead>
              <tbody>
                {rows.map((row, index) => (
                  <tr key={row.id || `${row.startsAt}-${index}`}>
                    {columns.map((column) => (
                      <td key={column}>{Array.isArray(row[column]) ? row[column].join(", ") : String(row[column] ?? "")}</td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          );
        }

        return (
          <div className="app">
            <header>
              <div>
                <h1>Meetler Test Console</h1>
                <div className="muted">Static nginx playground for backend API workflows.</div>
              </div>
              <div className="status">
                <div><span className={`pill ${hasToken ? "ok" : "warn"}`}>{hasToken ? "Token saved" : "No token"}</span></div>
                <div style={{ marginTop: 8 }}>API proxy: <strong>/api</strong></div>
              </div>
            </header>

            <nav className="tabs">
              {[
                ["auth", "Auth"],
                ["calendars", "Calendars"],
                ["availability", "Availability"],
                ["groups", "Groups"],
              ].map(([id, label]) => (
                <button key={id} className={tab === id ? "active" : ""} onClick={() => setTab(id)}>
                  {label}
                </button>
              ))}
            </nav>

            {tab === "auth" && AuthTab()}
            {tab === "calendars" && CalendarsTab()}
            {tab === "availability" && AvailabilityTab()}
            {tab === "groups" && GroupsTab()}

            <section className="wide" style={{ marginTop: 14 }}>
              <h2>Output</h2>
              <pre>{output}</pre>
            </section>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
