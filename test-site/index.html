<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meetler Auth Test</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #1f2937;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: 0;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 18px;
        letter-spacing: 0;
      }

      .layout {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      section {
        background: #ffffff;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        padding: 18px;
      }

      label {
        display: block;
        margin: 12px 0 6px;
        font-size: 13px;
        font-weight: 650;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        height: 38px;
        border: 1px solid #cbd2dc;
        border-radius: 6px;
        padding: 0 10px;
        font: inherit;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      button,
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        border: 1px solid #1f2937;
        border-radius: 6px;
        background: #1f2937;
        color: #ffffff;
        padding: 0 12px;
        font: inherit;
        font-weight: 650;
        text-decoration: none;
        cursor: pointer;
      }

      button.secondary,
      a.secondary {
        background: #ffffff;
        color: #1f2937;
      }

      button.danger {
        border-color: #b42318;
        background: #b42318;
      }

      pre {
        overflow: auto;
        min-height: 160px;
        max-height: 360px;
        margin: 0;
        border-radius: 8px;
        background: #111827;
        color: #d1d5db;
        padding: 14px;
        font-size: 13px;
        white-space: pre-wrap;
      }

      .status {
        margin-top: 10px;
        font-size: 13px;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Meetler Auth Test</h1>
      <div class="status" id="sessionStatus"></div>

      <div class="layout">
        <section>
          <h2>Password Auth</h2>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" />

          <label for="name">Name</label>
          <input id="name" type="text" autocomplete="name" />

          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" />

          <div class="buttons">
            <button id="registerButton" type="button">Register</button>
            <button id="loginButton" type="button">Login</button>
            <button id="logoutButton" class="danger" type="button">Logout</button>
          </div>
        </section>

        <section>
          <h2>OAuth Login</h2>
          <div class="buttons">
            <a class="button secondary" href="/api/auth/google/login">Google Login</a>
            <a class="button secondary" href="/api/auth/microsoft/login">Microsoft Login</a>
          </div>
        </section>

        <section>
          <h2>External Calendars</h2>
          <div class="buttons">
            <button id="googleCalendarButton" type="button">Connect Google Calendar</button>
          </div>
          <div class="status">
            This uses the access token saved after password login or manual token paste.
          </div>
        </section>

        <section>
          <h2>Tokens</h2>
          <label for="accessToken">Access token</label>
          <input id="accessToken" type="text" autocomplete="off" />

          <label for="refreshToken">Refresh token</label>
          <input id="refreshToken" type="text" autocomplete="off" />

          <div class="buttons">
            <button id="saveTokensButton" type="button">Save Tokens</button>
            <button id="clearTokensButton" class="secondary" type="button">Clear</button>
          </div>
        </section>
      </div>

      <section style="margin-top: 16px">
        <h2>Output</h2>
        <pre id="output"></pre>
      </section>
    </main>

    <script>
      const accessTokenInput = document.getElementById("accessToken");
      const refreshTokenInput = document.getElementById("refreshToken");
      const output = document.getElementById("output");
      const sessionStatus = document.getElementById("sessionStatus");

      function setCookie(name, value) {
        document.cookie = `${name}=${encodeURIComponent(value || "")}; Path=/; SameSite=Lax`;
      }

      function deleteCookie(name) {
        document.cookie = `${name}=; Path=/; Max-Age=0; SameSite=Lax`;
      }

      function saveTokens(tokens) {
        localStorage.setItem("meetler.accessToken", tokens.accessToken || "");
        localStorage.setItem("meetler.refreshToken", tokens.refreshToken || "");
        setCookie("meetler_access_token", tokens.accessToken || "");
        accessTokenInput.value = tokens.accessToken || "";
        refreshTokenInput.value = tokens.refreshToken || "";
        updateSessionStatus();
      }

      function clearTokens() {
        localStorage.removeItem("meetler.accessToken");
        localStorage.removeItem("meetler.refreshToken");
        deleteCookie("meetler_access_token");
        accessTokenInput.value = "";
        refreshTokenInput.value = "";
        updateSessionStatus();
      }

      function loadTokens() {
        accessTokenInput.value = localStorage.getItem("meetler.accessToken") || "";
        refreshTokenInput.value = localStorage.getItem("meetler.refreshToken") || "";
        setCookie("meetler_access_token", accessTokenInput.value);
        updateSessionStatus();
      }

      function updateSessionStatus() {
        const hasToken = Boolean(localStorage.getItem("meetler.accessToken"));
        sessionStatus.textContent = hasToken ? "Access token saved." : "No access token saved.";
      }

      function write(value) {
        output.textContent =
          typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      async function request(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        });

        const text = await response.text();
        const body = text ? JSON.parse(text) : null;

        if (!response.ok) {
          throw body || { status: response.status, message: response.statusText };
        }

        return body;
      }

      document.getElementById("registerButton").addEventListener("click", async () => {
        try {
          const body = {
            email: document.getElementById("email").value,
            name: document.getElementById("name").value,
            password: document.getElementById("password").value,
          };
          const tokens = await request("/api/auth/register", {
            method: "POST",
            body: JSON.stringify(body),
          });
          saveTokens(tokens);
          write(tokens);
        } catch (error) {
          write(error);
        }
      });

      document.getElementById("loginButton").addEventListener("click", async () => {
        try {
          const body = {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          };
          const tokens = await request("/api/auth/login", {
            method: "POST",
            body: JSON.stringify(body),
          });
          saveTokens(tokens);
          write(tokens);
        } catch (error) {
          write(error);
        }
      });

      document.getElementById("logoutButton").addEventListener("click", async () => {
        try {
          const refreshToken = localStorage.getItem("meetler.refreshToken");
          if (refreshToken) {
            await request("/api/auth/logout", {
              method: "POST",
              body: JSON.stringify({ refreshToken }),
            });
          }
          clearTokens();
          write("Logged out.");
        } catch (error) {
          write(error);
        }
      });

      document.getElementById("saveTokensButton").addEventListener("click", () => {
        saveTokens({
          accessToken: accessTokenInput.value,
          refreshToken: refreshTokenInput.value,
        });
        write("Tokens saved.");
      });

      document.getElementById("clearTokensButton").addEventListener("click", () => {
        clearTokens();
        write("Tokens cleared.");
      });

      document.getElementById("googleCalendarButton").addEventListener("click", () => {
        const accessToken = localStorage.getItem("meetler.accessToken");
        if (!accessToken) {
          write("Login first, or paste and save an access token.");
          return;
        }
        setCookie("meetler_access_token", accessToken);
        window.location.href = "/api/external-calendars/google/connect";
      });

      loadTokens();
    </script>
  </body>
</html>
